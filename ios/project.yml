name: LocalShelf
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  LocalShelf:
    type: application
    platform: iOS
    sources:
      - path: LocalShelfApp.swift
      - path: LibraryModels.swift
      - path: CoverEnhancements.swift
      - path: InteractionAlternatives.swift
      - path: Assets.xcassets
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.shelf.reader
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Info.plist
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.4.13
        CURRENT_PROJECT_VERSION: 39
  ReaderInteractionChecks:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ReaderInteractionChecks.swift
    dependencies:
      - target: LocalShelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.shelf.reader.interactionchecks
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LocalShelf
