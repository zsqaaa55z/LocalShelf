name: LocalShelf
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  LocalShelf:
    type: application
    platform: iOS
    sources:
      - path: LocalShelfApp.swift
      - path: LibraryModels.swift
      - path: CoverEnhancements.swift
      - path: InteractionAlternatives.swift
      - path: PersistentLibrary.swift
      - path: NASCacheChecks.swift
      - path: BodyCache.swift
      - path: CacheEfficiencyChecks.swift
      - path: ReaderUpdateChecks.swift
      - path: ManifestConditionalChecks.swift
      - path: ShelfUpdateChecks.swift
      - path: CoverPipelineBaseline.swift
      - path: SimulationChecks.swift
      - path: Connection.swift
      - path: ConnectionDiagnostics.swift
      - path: DiagnosticChecks.swift
      - path: ImageWorkQueues.swift
      - path: Library.swift
      - path: AnimationPlayback.swift
      - path: AnimationPolicy.swift
      - path: AnimationPolicyChecks.swift
      - path: ReadingCache.swift
      - path: ReaderPager.swift
      - path: PositionControls.swift
      - path: ReaderView.swift
      - path: ShelfView.swift
      - path: DebugAppContent.swift
      - path: ConnectionRecoveryChecks.swift
      - path: LocalUpdateChecks.swift
      - path: RelatedShelf.swift
      - path: RelatedChecks.swift
      - path: PrivacyInfo.xcprivacy
      - path: Assets.xcassets
    settings:
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.shelf.reader
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.4.38
        CURRENT_PROJECT_VERSION: 65
  ReaderInteractionChecks:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ReaderInteractionChecks.swift
    dependencies:
      - target: LocalShelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.shelf.reader.interactionchecks
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LocalShelf
